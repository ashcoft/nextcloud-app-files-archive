#
# Stylelint over the frontend sources (Vue single-file components and plain
# CSS). Only the sources are linted; the built `css/` output is generated by
# the bundler and is git-ignored.
name: Lint stylelint

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: lint-stylelint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stylelint:
    runs-on: ubuntu-latest
    name: stylelint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json is not tracked, so `npm ci` is not available.
        run: npm install

      - name: Run stylelint
        run: npm run stylelint
