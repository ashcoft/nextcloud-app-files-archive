#
# Frontend unit tests (Vitest). These run against the sources with a jsdom
# environment and a small set of global stubs, so they stay fast and do not
# need a Nextcloud server.
name: Node tests

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: node-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json is not tracked, so `npm ci` is not available.
        run: npm install

      - name: Run unit tests
        run: npm run test:unit
