# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Release on every push to main: semantic-release derives the next version from
# the conventional commit messages, bumps appinfo/info.xml and package.json,
# commits them, creates the tag and a DRAFT GitHub release. The build job then
# builds the app archive from that tag and attaches it before publishing the
# draft, so a release never goes public without its assets.
#
# The build itself lives in the reusable build-appstore.yml workflow, shared
# with the CI checks on pull requests, so the release artifact and the checked
# one can never drift apart.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no release)
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only the canonical repository owns the releases; forks do not publish.
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # semantic-release needs the full history and tags to pick the next
          # version; it pushes the release commit itself.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # semantic-release needs no build; skip dependency lifecycle scripts.
        run: npm install --ignore-scripts

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(git rev-parse HEAD)
          npx semantic-release
          after=$(git rev-parse HEAD)

          # Read the tag semantic-release created on this commit rather than
          # comparing globally newest tags.
          version=$(git tag --points-at HEAD --sort=-v:refname | head -n1)
          if [ -n "$version" ] && [ "$after" != "$before" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-appstore.yml
    with:
      ref: v${{ needs.release.outputs.version }}

  publish:
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Attach the archive and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          gh release upload "$TAG" "files_archive-${{ needs.build.outputs.version }}.tar.gz" --clobber
          # Publish only now that the archive is attached, so a release never
          # goes public without its assets.
          gh release edit "$TAG" --draft=false
          echo "Published release $TAG"
