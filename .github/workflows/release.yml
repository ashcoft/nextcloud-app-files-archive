# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Attach the ready-to-use app archive to the GitHub release whenever a
# `vX.Y.Z*` tag is pushed. The build itself lives in the reusable
# build-appstore.yml workflow, shared with the CI checks on pull
# requests. The job can also be triggered manually (workflow_dispatch)
# to test the build without creating a tag; in that case the tarball is
# only kept as a workflow artifact and not attached to any release.
name: Build release tarball

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  version:
    # Gate the release on the version guard: a tag whose appinfo/info.xml and
    # package.json disagree must not produce a published archive.
    permissions:
      contents: read
    uses: ./.github/workflows/version-check.yml

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-appstore.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Determine whether this is a pre-release
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only plain x.y.z prefixed with v is a final release.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous_stable="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -r --arg current "$TAG" \
              'add | map(select(.draft == false and .prerelease == false and .tag_name != $current)) | sort_by(.published_at) | last | .tag_name // empty')"

          body_path="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$previous_stable" ]]; then
            printf 'See [CHANGELOG.md](%s/blob/%s/CHANGELOG.md).\n\n**Full Changelog**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$TAG" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$previous_stable" \
              "$TAG" > "$body_path"
          else
            # First stable release in this repository (e.g. a fresh fork with
            # no releases yet): there is nothing to compare against.
            printf 'See [CHANGELOG.md](%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$TAG" > "$body_path"
          fi
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.kind.outputs.prerelease }}
          files: files_archive-${{ needs.build.outputs.version }}.tar.gz
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true
