#
# appinfo/info.xml is what Nextcloud and the release pipeline read, and
# package.json mirrors it. They must not drift apart, or a release archive can
# carry the wrong version.
#
# The workflow is also callable (workflow_call) so the release workflow can
# gate publishing on it: a tag must not produce a release whose archive carries
# a different version. Tag pushes are validated there rather than here, so the
# check does not run twice on a tag.
name: Version check

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Key PR runs by number so forks sharing a branch name do not cancel each
  # other's required check.
  group: version-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    name: version
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check info.xml and package.json versions match
        run: |
          # Parse the XML so malformed metadata fails here instead of being
          # read as text (a comment could also carry a stray <version>).
          INFO=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').getroot().findtext('version') or '')")
          PKG=$(node -p "require('./package.json').version")
          echo "info.xml=$INFO package.json=$PKG"
          if [ -z "$INFO" ]; then
            echo "::error::Could not read <version> from appinfo/info.xml"
            exit 1
          fi
          if [ "$INFO" != "$PKG" ]; then
            echo "::error::Version mismatch: appinfo/info.xml ($INFO) != package.json ($PKG)"
            exit 1
          fi

      - name: Check the release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          INFO=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').getroot().findtext('version') or '')")
          # Pre-release tags carry the suffix in both the tag and info.xml
          # (v1.3.1-rc1 -> 1.3.1-rc1), so the whole tag after "v" must match.
          if [ "${TAG#v}" != "$INFO" ]; then
            echo "::error::Tag $TAG does not match appinfo/info.xml version $INFO"
            exit 1
          fi
          echo "tag $TAG matches appinfo/info.xml version $INFO"
