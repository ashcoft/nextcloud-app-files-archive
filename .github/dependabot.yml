version: 2
updates:
  # Frontend dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      vue-dependencies:
        patterns:
          - "vue*"
          - "@vue/*"
      nextcloud-dependencies:
        patterns:
          - "@nextcloud/*"

  # Keep the GitHub Actions used by the workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
