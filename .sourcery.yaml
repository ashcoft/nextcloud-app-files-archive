# Sourcery configuration.
#
# The committed package-lock.json records the license of every dependency,
# including the GPL/AGPL @nextcloud/* framework packages this AGPL app already
# depends on. Sourcery's license scanner reads those metadata lines and flags
# each one, which is a false positive: the licenses are compatible with this
# AGPL-3.0-or-later app. Exclude the lockfile so the findings are not repeated
# on every dependency change; the dependency set itself is reviewed through
# package.json and Dependabot.
ignore:
  - package-lock.json
  - '**/package-lock.json'
